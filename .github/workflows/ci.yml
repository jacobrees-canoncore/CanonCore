name: CI

on: push

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a push is only safe where a later commit replaces the earlier
  # one as the thing being judged. On `main` it does not: every push there is
  # its own release, and a cancelled run is not a passing one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # This name IS the required status check context on `main`'s ruleset. Renaming it
    # blocks every merge for ever ("Expected — Waiting for status to be reported") until
    # the ruleset is updated too, so the two are changed together or not at all.
    # `scripts/check-docs.ts` fails the build if they ever disagree.
    #
    # It is a summary of this job rather than a manifest of it, and deliberately so. Role
    # creation, the `vercel` install, the documents check, the migration and the promotion
    # had all joined without it changing, and the audit below makes six. Each rename would
    # cost a coordinated ruleset edit, with a window in which the required context is missing
    # and the pull request cannot merge, to buy a longer string — so a step joins on its
    # merits and the name stays put. Settled by CAN-54 Fail a push that adds a
    # known-vulnerable dependency, against an earlier wording here ("added to rather than
    # replaced when a step joins") that those five steps had already contradicted.
    #
    # The release steps at the end are in this job rather than a job of their own because
    # they never run on a pull request: a job that cannot report on a pull request cannot be
    # a required context, and this repository's documented model is one job, one context.
    # docs/infrastructure.md -> The ruleset.
    name: test, typecheck, lint, build
    runs-on: ubuntu-latest

    services:
      # What the row-level security tests connect to. A container rather than a per-run Neon
      # branch is ADR-0005 rule 2's own answer; 17 because production is PostgreSQL 17.10, read
      # from Neon on 14 August 2026.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canoncore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The container starts with one superuser and no application roles, so the three the tests
      # connect as have to be made. Neon provisions them in production; this file is how a
      # PostgreSQL with no Neon behind it ends up with the same three and the same privileges.
      - name: Create the application, migration and auth roles
        run: psql "$SUPERUSER_URL" -f apps/web/src/db/roles.sql
        env:
          SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/canoncore_test

      # Three commands, not one. `pnpm -r test typecheck lint` passes the last
      # two to the `test` script as arguments and silently skips them — see
      # docs/agents/workflow.md.
      #
      # The three URLs are what let `apps/web/src/db/rls.test.ts` run at all. It fails rather
      # than skips when they are missing here — docs/agents/workflow.md -> The gates says why.
      #
      # The third arrived with CAN-24 A signed-in and a signed-out path: better-auth connects as a
      # role of its own, because the thing that authenticates cannot be constrained by the identity
      # it establishes (`apps/web/src/auth/auth.ts`). The suite asserts what each of the three may
      # reach, so all three have to be connectable from here.
      - run: pnpm -r test
        env:
          RLS_TEST_MIGRATOR_URL: postgresql://canoncore_migrator:canoncore_migrator@localhost:5432/canoncore_test
          RLS_TEST_APP_URL: postgresql://canoncore_app:canoncore_app@localhost:5432/canoncore_test
          RLS_TEST_AUTH_URL: postgresql://canoncore_auth:canoncore_auth@localhost:5432/canoncore_test
      - run: pnpm -r typecheck
      - run: pnpm -r lint

      # A fourth, and not one of the three the ticket named. `next build` fails
      # on things the other three cannot see — a server-only API reached from a
      # client component, a page that throws during static generation — and
      # without it the first machine to find out is the deploy.
      - run: pnpm -r build

      # A known-vulnerable dependency, failing the push rather than sitting unnoticed. Three
      # things about this line are decisions rather than defaults — that it runs after the four
      # above rather than before them, that the threshold is `high`, and that
      # `--ignore-registry-errors` is not passed. All three are argued once, in
      # docs/agents/workflow.md -> The gates.
      - run: pnpm audit --audit-level=high

      # The documents, checked against the sources they describe. Last of the gates, so that a
      # drift in prose is never the first thing to fail while the build is broken.
      #
      # `vercel` is installed and given a token so the variable roster genuinely gates: an
      # undocumented credential is how a roster goes stale, and that is the roster with
      # security weight. Without the secret the check reports SKIP and says so. The release
      # steps below use the same installation.
      #
      # Three of its checks reach no source from here, on purpose rather than by omission: the
      # label roster needs `orca`, a desktop CLI, and the secret roster and the security-settings
      # roster each need a credential this workflow cannot be granted. All three report SKIP, and
      # the run's own summary page says so, so a green tick never stands in for a comparison that
      # did not happen. Everything else it checks
      # does reach a source from here, the release token's expiry included: listing the account's
      # tokens is within this token's reach, which was read off a run rather than assumed.
      # docs/agents/workflow.md -> The gates is the table of which check reaches which source.
      # npm rather than pnpm: `pnpm add -g` needs PNPM_HOME configured, npm's global bin is
      # already on a runner's PATH. If the install or the token fails, the check reports SKIP
      # with the reason rather than failing the build.
      - run: npm i -g vercel@58
      - run: node scripts/check-docs.ts --verbose
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # --- The release. `main` only, and only once everything above is green. ---
      #
      # Migrate, then build, then promote. Why this job owns that order rather than Vercel, and
      # why previews are deliberately left deploying from Git: docs/adr/0019-ci-owns-the-production-release.md.
      # The procedure around it is docs/agents/workflow.md -> What a merge carries.

      - name: Apply Drizzle migrations
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @canoncore/web db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # `--prebuilt` deploys "existing build output from the .vercel/output directory"
      # (https://vercel.com/docs/cli/deploy), so this promotes what the line above it built and
      # never triggers a build of its own — which is what keeps the migration in front of it.
      #
      # Letting Vercel build instead, to buy its build cache and a project-scoped token, does not
      # help: `vercel deploy` resolves the linked project through the same call `vercel pull` does,
      # so the narrower token has nothing to gain. That is an endpoint trace rather than a run on a
      # project-scoped token, and docs/infrastructure.md -> Why this one is account-scoped carries
      # it with that distinction made.
      #
      # The two ids are project identifiers, not credentials: `vercel project inspect canoncore`
      # prints the second, and docs/infrastructure.md -> Hosting records it.
      - name: Build and promote the production deployment
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_fM6JucuEULAiTuHY5TM5h3TP
          VERCEL_PROJECT_ID: prj_BMzP9Dq7Qx3Eev8WwsvVoH5khnaU
