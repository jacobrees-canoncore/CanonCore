name: CI

on: push

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a push is only safe where a later commit replaces the earlier
  # one as the thing being judged. On `main` it does not: every push there is
  # its own release, and a cancelled run is not a passing one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # This name IS the required status check context on `main`'s ruleset. Renaming it
    # blocks every merge for ever ("Expected — Waiting for status to be reported") until
    # the ruleset is updated too, so the two are changed together or not at all.
    # `scripts/check-docs.ts` fails the build if they ever disagree, which is also why
    # the name is added to rather than replaced when a step joins the job.
    #
    # The release steps at the end are in this job rather than a job of their own, and the
    # name is unchanged for them, because they never run on a pull request: a job that
    # cannot report on a pull request cannot be a required context, and this repository's
    # documented model is one job, one context. docs/infrastructure.md -> The ruleset.
    name: test, typecheck, lint, build
    runs-on: ubuntu-latest

    services:
      # The row-level security tests need a real PostgreSQL, because RLS is the database's
      # behaviour and a stub of it would assert only what the stub was written to do. A
      # container rather than a per-run Neon branch: RLS is vanilla PostgreSQL, so a container
      # tests it hermetically and couples no push to an external control plane. ADR-0005 rule 2,
      # settled by CAN-73 Settle the Snapshot layer, the CI database seam, and forked-Snapshot
      # erasure before CAN-23.
      #
      # 17 because production is PostgreSQL 17.10, read from Neon on 14 August 2026.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canoncore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The container starts with one superuser and no application roles, so the two the tests
      # connect as have to be made. Neon provisions them in production; this file is how a
      # PostgreSQL with no Neon behind it ends up with the same two and the same privileges.
      - name: Create the application and migration roles
        run: psql "$SUPERUSER_URL" -f apps/web/src/db/roles.sql
        env:
          SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/canoncore_test

      # Three commands, not one. `pnpm -r test typecheck lint` passes the last
      # two to the `test` script as arguments and silently skips them — see
      # docs/agents/workflow.md.
      #
      # The two URLs are what let `apps/web/src/db/rls.test.ts` run at all, and it fails
      # outright rather than skipping if they are missing here: a skipped cross-tenant read
      # test reports exactly what a broken policy reports.
      - run: pnpm -r test
        env:
          RLS_TEST_MIGRATOR_URL: postgresql://canoncore_migrator:canoncore_migrator@localhost:5432/canoncore_test
          RLS_TEST_APP_URL: postgresql://canoncore_app:canoncore_app@localhost:5432/canoncore_test
      - run: pnpm -r typecheck
      - run: pnpm -r lint

      # A fourth, and not one of the three the ticket named. `next build` fails
      # on things the other three cannot see — a server-only API reached from a
      # client component, a page that throws during static generation — and
      # without it the first machine to find out is the deploy.
      - run: pnpm -r build

      # The documents, checked against the sources they describe. Last of the gates, so that a
      # drift in prose is never the first thing to fail while the build is broken.
      #
      # `vercel` is installed and given a token so the variable roster genuinely gates: an
      # undocumented credential is how a roster goes stale, and that is the roster with
      # security weight. Without the secret the check reports SKIP and says so. The release
      # steps below use the same installation.
      #
      # `orca` is a local desktop CLI and cannot run on a runner, so the label roster is a
      # local gate — docs/agents/workflow.md -> The gates records which checks reach which.
      # npm rather than pnpm: `pnpm add -g` needs PNPM_HOME configured, npm's global bin is
      # already on a runner's PATH. If the install or the token fails, the check reports SKIP
      # with the reason rather than failing the build.
      - run: npm i -g vercel@58
      - run: node scripts/check-docs.ts --verbose
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # --- The release. `main` only, and only once everything above is green. ---
      #
      # Vercel does not deploy `main` itself: `apps/web/vercel.json` turns the Git integration
      # off for that one branch, so this job owns the order. Nothing else can — a push starts a
      # Vercel build immediately, and a migration racing a deploy is the failure
      # docs/incidents.md -> Waveger: the build ran no migrations, and nobody knew describes.
      # Previews are untouched and still deploy from Git, which is what keeps the `Vercel`
      # required context reporting on every pull request.

      - name: Apply Drizzle migrations
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @canoncore/web db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # Built here rather than by Vercel, because a build on Vercel is a deploy on Vercel and
      # the point of this ordering is that the migration went first. `--prebuilt` ships the
      # output this step made; `--prod` is what assigns the production domain, so this line is
      # the promotion and the migration above has already succeeded by the time it runs.
      #
      # The two ids are project identifiers, not credentials: `vercel project inspect canoncore`
      # prints the second, and docs/infrastructure.md -> Hosting records it.
      - name: Build and promote the production deployment
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_fM6JucuEULAiTuHY5TM5h3TP
          VERCEL_PROJECT_ID: prj_BMzP9Dq7Qx3Eev8WwsvVoH5khnaU
