<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CanonCore">
  <!--
    The mark: three entries, one of them placed differently from the other two. That is the whole
    product in a shape a browser tab can still read at 16 pixels, and it is why the middle bar is
    indented rather than merely shorter.

    The two colours are `focus` and `bg` from `@canoncore/config`'s palette, written out because an
    SVG asset cannot import. `design-tokens.test.ts` asserts they are still the palette's, so this
    file cannot drift away from it quietly. The accent rather than the near-black ink, because a
    tab strip may be either colour and this has to be visible on both.
  -->
  <rect width="32" height="32" rx="7" fill="#2f7d76"/>
  <g fill="#fbfaf8">
    <rect x="7" y="8" width="18" height="3" rx="1.5"/>
    <rect x="13" y="14.5" width="12" height="3" rx="1.5"/>
    <rect x="7" y="21" width="18" height="3" rx="1.5"/>
  </g>
</svg>
